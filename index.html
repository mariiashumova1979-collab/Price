<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Анализ методологий доходности</title>
<style>
:root {
  --bg:#F8F7F2; --surf:#FFFFFF; --text:#1A1A18; --accent:#1D9E75;
  --p1-col:#378ADD; --p2-col:#1D9E75; --f24-col:#EF9F27;
  --border:rgba(0,0,0,0.08); --radius:12px;
}
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 40px 20px; line-height: 1.5; }
.container { max-width: 900px; margin: 0 auto; }
.card { background: var(--surf); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }

/* Улучшенные заголовки */
h1 { font-size: 24px; margin-bottom: 8px; }
.subtitle { color: #666; margin-bottom: 24px; }

/* Карточка выбранного тикера */
.ticker-hero { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
.val-box { border-left: 4px solid var(--border); padding-left: 15px; }
.val-label { font-size: 12px; text-transform: uppercase; color: #888; letter-spacing: 0.5px; }
.val-big { font-size: 28px; font-weight: 700; font-family: monospace; }

/* Таблица */
table { width: 100%; border-collapse: collapse; margin-top: 10px; }
th { text-align: left; font-size: 12px; color: #888; padding: 12px; border-bottom: 2px solid var(--border); }
td { padding: 12px; border-bottom: 1px solid var(--border); }
tr:hover { background: #fdfdfd; cursor: pointer; }
.selected { background: #f0f7f4 !important; }

.badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
</style>
</head>
<body>

<div class="container">
  <h1>Симуляция методологий</h1>
  <p class="subtitle">Сравнение расчета доходности через праздничные разрывы (6M).</p>

  <div class="card" id="hero-card">
    </div>

  <div class="card">
    <h3>Выбор тикера</h3>
    <div id="tkbtns" style="display: flex; gap: 10px; margin-top: 10px;"></div>
  </div>

  <div class="card">
    <h3>Сравнение данных</h3>
    <table id="main-table">
      <thead>
        <tr>
          <th>Тикер</th>
          <th>П2 (IBKR)</th>
          <th>П1 (График)</th>
          <th>Freedom24</th>
          <th>Спред</th>
        </tr>
      </thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
</div>

<script>
// (Логика данных остается прежней, адаптирован рендеринг)
const STOCKS=[
  {tk:'NVDA',nm:'Nvidia',n26:180.26,n28:177.00,now:212.60},
  {tk:'GOOGL',nm:'Alphabet',n26:319.95,n28:320.18,now:388.83},
  {tk:'MSFT',nm:'Microsoft',n26:485.50,n28:492.01,now:412.67},
  {tk:'AMZN',nm:'Amazon',n26:229.16,n28:233.22,now:271.85},
  {tk:'AVGO',nm:'Broadcom',n26:397.57,n28:402.96,now:421.86}
];
const F24={NVDA:19.71,GOOGL:19.51,MSFT:-13.38,AMZN:18.40,AVGO:8.79};
let sel='NVDA';

function pct(n,b){ return +((n-b)/b*100).toFixed(2); }

function render() {
  const data = STOCKS.map(s => ({
    ...s, 
    p2: pct(s.now, s.n26), 
    p1: pct(s.now, s.n28), 
    f24: F24[s.tk]
  }));

  const active = data.find(d => d.tk === sel);

  // Рендер Hero
  document.getElementById('hero-card').innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <div><h2>${active.tk} <span style="color:#888; font-size:18px;">${active.nm}</span></h2></div>
        <div class="ticker-hero">
            <div class="val-box" style="border-color:var(--p2-col)"><div class="val-label">П2 (IBKR)</div><div class="val-big">${active.p2}%</div></div>
            <div class="val-box" style="border-color:var(--p1-col)"><div class="val-label">П1 (График)</div><div class="val-big">${active.p1}%</div></div>
        </div>
    </div>
  `;

  // Рендер кнопок
  document.getElementById('tkbtns').innerHTML = STOCKS.map(s => 
    `<button onclick="sel='${s.tk}'; render()" style="padding:8px 16px; cursor:pointer; border-radius:6px; border:1px solid var(--border); ${s.tk===sel?'background:var(--p2-col); color:white;':''}">${s.tk}</button>`
  ).join('');

  // Рендер таблицы
  document.getElementById('tb').innerHTML = data.map(d => `
    <tr class="${d.tk===sel?'selected':''}" onclick="sel='${d.tk}'; render()">
      <td><strong>${d.tk}</strong></td>
      <td>${d.p2}%</td>
      <td>${d.p1}%</td>
      <td>${d.f24}%</td>
      <td><span class="badge" style="background:#eee">${(d.p2-d.p1).toFixed(2)}%</span></td>
    </tr>
  `).join('');
}

render();
</script>
</body>
</html>
